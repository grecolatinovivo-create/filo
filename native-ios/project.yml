# FILO — progetto Xcode generato da XcodeGen (dottrina fabbrica-app):
# NESSUN .xcodeproj nel repo; questo file è la sorgente di verità e il
# progetto viene rigenerato in CI con `xcodegen generate`.
#
# Doppia natura senza conflitti: gli stessi sorgenti Sources/FiloCore sono
# anche un package SPM (Package.swift) per eseguire i test su Linux; qui
# FiloCore è un framework, così `import FiloCore` vale in entrambi i mondi.
name: FILO

options:
  bundleIdPrefix: com.grecolatinovivo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: it
  knownRegions: [it, en, fr, es, de, zh-Hans, pt-BR, ja]

settings:
  base:
    MARKETING_VERSION: 1.1.0
    # Build number: sovrascritto in CI con CURRENT_PROJECT_VERSION=github.run_number
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.9"

targets:
  FiloCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/FiloCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grecolatinovivo.filo.core
        GENERATE_INFOPLIST_FILE: YES

  FILO:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Resources
    dependencies:
      - target: FiloCore
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grecolatinovivo.filo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    # Sign in with Apple in PAUSA: l'entitlement richiede firma di distribuzione
    # manuale (certificato .p12) e faceva fallire l'archivio in CI. Rimosso così
    # la firma cloud all'export torna a funzionare come per le altre app. Il
    # pulsante "Accedi con Apple" è nascosto via AppConfig.appleSignInEnabled.
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: FILO
        CFBundleName: FILO
        CFBundleDevelopmentRegion: it
        CFBundleLocalizations: [it, en, fr, es, de, zh-Hans, pt-BR, ja]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false

  FiloCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/FiloCoreTests
    dependencies:
      - target: FiloCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grecolatinovivo.filo.coretests
        GENERATE_INFOPLIST_FILE: YES

  # UI test (XCUITest) per gli SCREENSHOT App Store, lanciato SOLO dal
  # workflow manuale screenshots-ios.yml. I sorgenti di FiloCore sono compilati
  # DENTRO il bundle di test (nessun framework da incorporare nel runner): il
  # test calcola il puzzle del giorno e il percorso del Sarto con lo stesso
  # generatore dell'app. Non tocca il binario dell'app né la build di check.
  FILOUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
      - path: Sources/FiloCore
    dependencies:
      - target: FILO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grecolatinovivo.filo.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FILO
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  FILO:
    build:
      targets:
        FILO: all
        FiloCoreTests: [test]
        FILOUITests: [test]
    test:
      targets:
        - FiloCoreTests
        - FILOUITests

  # Scheme dedicato agli screenshot: solo app + UI test, così il workflow
  # screenshots-ios.yml non dipende dalla compilazione degli altri test.
  FILOScreenshots:
    build:
      targets:
        FILO: all
        FILOUITests: [test]
    test:
      config: Debug
      targets:
        - FILOUITests
